<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untappd Check-in Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>🍺 Untappd Check-in Map</h1>
      <p id="summary">Loading your beer history…</p>
    </div>
  </header>

  <section class="controls" aria-label="Map filters">
    <label>
      Trip
      <select id="trip"></select>
    </label>
    <label>
      Start
      <input id="start" type="date">
    </label>
    <label>
      End
      <input id="end" type="date">
    </label>
    <label class="wide">
      Search beer / brewery / venue
      <input id="search" type="search" placeholder="e.g. IPA, Sierra Nevada, Denver">
    </label>
    <button id="reset" type="button">Reset</button>
  </section>

  <main>
    <div id="map" aria-label="Map of Untappd check-ins"></div>
    <aside id="details" aria-live="polite">
      <h2>Check-in details</h2>
      <p>Select a point on the map.</p>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
